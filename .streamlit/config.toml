[theme]
base = "dark"
primaryColor = "#8b5cf6"
backgroundColor = "#0b0d12"
secondaryBackgroundColor = "#161a23"
textColor = "#eceef4"
borderColor = "#262b38"
linkColor = "#c4b5fd"
baseRadius = "0.55rem"
buttonRadius = "0.5rem"
baseFontSize = 15
# System fonts only, so nothing is downloaded: Segoe UI on Windows, San Francisco on macOS.
font = "Segoe UI Variable Text, Segoe UI, -apple-system, BlinkMacSystemFont, system-ui, sans-serif"
headingFont = "Segoe UI Variable Display, Segoe UI, -apple-system, BlinkMacSystemFont, system-ui, sans-serif"
headingFontWeights = [700, 650, 650, 600, 600, 600]
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#10131a"
secondaryBackgroundColor = "#181c26"

[client]
toolbarMode = "minimal"

[browser]
# Keep the app fully local: no usage statistics are sent to Streamlit.
gatherUsageStats = false
